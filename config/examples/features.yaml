# Native web and schema2 memory are prepared; only explicit live starts them.
bilibili:
  enabled: false
members:
  enabled: false
memes:
  enabled: false
memory:
  enabled: true
  learning_enabled: true
  max_chars_per_group: 50000
  max_group_file_bytes: 1048576
  max_groups: 16
  max_total_bytes: 8388608
vision:
  enabled: false
web:
  enabled: true
  engine: codebuddy_cli
  search_enabled: true
  cli_max_tool_calls: 3
  cli_max_turns: 4
  cli_tool_result_bytes: 8000
